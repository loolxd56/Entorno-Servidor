{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tres en Raya</title>
    <link rel="stylesheet" href="{% static 'css/3enraya.css' %}">
</head>
<body>

    <h1>Tres en raya</h1>
    <p>{{ mensaje }}</p>
    
    <div>
        {% if not terminado %}
            <form action="{% url 'tres_en_raya' %}" method="post">
                {% csrf_token %}
                
                <!-- Se eliminaron los input hidden de tablero y turno -->
                
                <div class="tablero">
                    {% for casilla in tablero %}                    
                        <button type="submit" name="posicion" value="{{ forloop.counter0 }}" class="casilla">
                            {{ casilla }}
                        </button>
                    {% endfor %}
                </div>
            </form>
        {% else %}
            <!-- Botón para reiniciar la sesión cuando acabe la partida -->
            <form action="{% url 'tres_en_raya' %}" method="post">
                {% csrf_token %}
                <button type="submit" name="reiniciar" value="1">Jugar de nuevo</button>
            </form>
        {% endif %}
    </div>

</body>
</html>
